version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      dev-tooling:
        dependency-type: development
    ignore:
      # typescript-eslint пока не поддерживает TypeScript 7 (у него нет JS API) — см. docs/qa/audit.md
      - dependency-name: typescript
        versions: ['>=6.1']
      # Phaser 4 — мажорная версия с новым рендерером: миграция отдельной задачей после визуальных тестов
      - dependency-name: phaser
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
